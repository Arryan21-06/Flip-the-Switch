[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daybreak"
version = "0.1.0"
description = "Evidence-linked standups and human-approved GitHub nudges"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["daybreak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
